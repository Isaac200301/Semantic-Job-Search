# Configuracion del analisis de SonarQube Cloud (antes SonarCloud).
#
# El token NO va aqui: se guarda como secreto SONAR_TOKEN del repositorio y lo
# lee el workflow de GitHub Actions (.github/workflows/ci.yml).
#
# IMPORTANTE: estas dos claves tienen que coincidir con las que muestra
# SonarQube Cloud en el proyecto (Information > Project Key / Organization Key).
# Si el analisis falla con "Project not found" o "could not find organization",
# es casi siempre porque alguna de las dos no cuadra.
sonar.projectKey=Isaac200301_Semantic-Job-Search
sonar.organization=isaac200301

sonar.projectName=Semantic Job Search
sonar.projectVersion=0.1.0

# --- Que se analiza ---------------------------------------------------------
# Solo el codigo que se despliega. Los notebooks son el trabajo exploratorio
# (limpieza, embeddings, evaluacion) y no forman parte del producto.
sonar.sources=api/app,frontend
sonar.tests=tests

sonar.exclusions=\
  notebooks/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  api/data/**,\
  htmlcov/**

# --- Cobertura --------------------------------------------------------------
# Lo genera pytest-cov: python -m pytest  (ver pytest.ini)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Las pruebas no se miden a si mismas.
sonar.coverage.exclusions=\
  tests/**,\
  api/descargar_datos.py,\
  api/generar_datos_busqueda.py

sonar.sourceEncoding=UTF-8
