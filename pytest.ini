[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -q
    --strict-markers
    --cov=api/app
    --cov=frontend
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov

# `app.py` de Streamlit se ejecuta de arriba abajo al importarse; sin esto
# pytest intentaría recolectarlo como si fuera un módulo de pruebas.
norecursedirs = .git .venv notebooks api/data htmlcov

markers =
    integracion: prueba que necesita la API real levantada (se omite por defecto)
